name: CD

# Runs after the CI workflow succeeds on main, or manually from the Actions tab.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  ACR_REGISTRY: crpi-aq7wi69rg06f57t5.cn-beijing.personal.cr.aliyuncs.com
  ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
  ECS_REGION: cn-beijing
  ECS_INSTANCE_ID: i-2zefdb9ur96jyr9ji6bg

jobs:
  build-push:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # ACR personal edition rejects the OCI attestation manifests that
          # BuildKit attaches by default, failing the push with "unknown
          # manifest class for application/vnd.oci.empty.v1+json".
          provenance: false
          sbom: false
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/offerpilot-api:${{ github.sha }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/offerpilot-api:latest

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web/Dockerfile
          provenance: false
          sbom: false
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/offerpilot-web:${{ github.sha }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/offerpilot-web:latest

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install aliyun CLI
        run: |
          curl -fsSL -o /tmp/aliyun.tgz https://aliyun-cli.oss-cn-hangzhou.aliyuncs.com/aliyun-cli-linux-latest-amd64.tgz
          sudo tar xz -C /usr/local/bin -f /tmp/aliyun.tgz
          aliyun version

      - name: Deploy on ECS via Cloud Assistant
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          # The CLI resolves its own region context from this variable and
          # aborts with "region can't be empty" before building the request;
          # --RegionId is only an API parameter and does not satisfy it.
          ALIBABA_CLOUD_REGION_ID: ${{ env.ECS_REGION }}
        run: |
          set -euo pipefail
          # The ECS copy of the compose file is not a checkout, so write the
          # repo version on every deploy; otherwise a compose change would
          # silently keep running the stale copy that was placed there once.
          COMPOSE_B64=$(base64 -w0 docker-compose.prod.yml)

          # RunCommand takes a repeatList, not a JSON array string; also wait for
          # the containers to report healthy before declaring the deploy good.
          SCRIPT='set -e
          cd /root/offerpilot
          echo '"$COMPOSE_B64"' | base64 -d > docker-compose.prod.yml
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          docker image prune -f
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3001/health/ready \
               && curl -fsS -o /dev/null http://127.0.0.1:3000/api/health; then
              echo "health ok"; exit 0
            fi
            sleep 5
          done
          echo "containers did not become healthy"; docker compose -f docker-compose.prod.yml ps; exit 1'
          ENCODED=$(printf '%s' "$SCRIPT" | base64 -w0)

          # The first deploy pulls two images onto a 2 vCPU / 2 GB box, so
          # give the remote script well beyond the default window.
          INVOKE_ID=$(aliyun ecs RunCommand \
            --RegionId "$ECS_REGION" \
            --InstanceId.1 "$ECS_INSTANCE_ID" \
            --Type RunShellScript \
            --ContentEncoding Base64 \
            --Timeout 900 \
            --CommandContent "$ENCODED" \
            | jq -r '.InvokeId')
          echo "InvokeId=$INVOKE_ID"

          for _ in $(seq 1 90); do
            sleep 10
            RESULT=$(aliyun ecs DescribeInvocationResults --RegionId "$ECS_REGION" --InvokeId "$INVOKE_ID")
            STATUS=$(printf '%s' "$RESULT" | jq -r '.Invocation.InvocationResults.InvocationResult[0].InvocationStatus')
            echo "status=$STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Timeout)
                printf '%s' "$RESULT" \
                  | jq -r '.Invocation.InvocationResults.InvocationResult[0].Output' \
                  | base64 -d || true
                exit 1
                ;;
            esac
          done
          echo "deploy timed out after 900s"
          exit 1
